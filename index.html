<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8102e" />
    <meta
      name="description"
      content="दैनिक भास्कर — देश-दुनिया की ताज़ा खबरें पढ़ें।"
    />
    <title>दैनिक भास्कर | ताज़ा खबरें</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="topline">
        <button class="location-button" type="button" aria-label="शहर चुनें">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s8-7.1 8-13a8 8 0 1 0-16 0c0 5.9 8 13 8 13Z" />
            <circle cx="12" cy="9" r="2.5" />
          </svg>
          <span>भोपाल</span>
          <span class="chevron">⌄</span>
        </button>
        <time class="edition" id="edition-date"></time>
        <button class="icon-button search-toggle" type="button" aria-label="खबर खोजें">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" />
            <path d="m16 16 5 5" />
          </svg>
        </button>
      </div>
      <div class="brand-row">
        <a class="brand" href="#" aria-label="दैनिक भास्कर होम">
          <span class="brand-sun" aria-hidden="true">✳</span>
          <span>दैनिक भास्कर</span>
        </a>
        <span class="brand-caption">सच के साथ</span>
      </div>
      <form class="search-form" role="search" hidden>
        <label class="visually-hidden" for="search-input">खबर खोजें</label>
        <input id="search-input" type="search" placeholder="खबर खोजें..." />
        <button type="button" class="search-close" aria-label="खोज बंद करें">×</button>
      </form>
    </header>

    <nav class="category-nav" aria-label="खबरों की श्रेणियां">
      <button class="category active" type="button" data-category="सभी">टॉप खबरें</button>
      <button class="category" type="button" data-category="देश">देश</button>
      <button class="category" type="button" data-category="मध्यप्रदेश">मध्यप्रदेश</button>
      <button class="category" type="button" data-category="दुनिया">दुनिया</button>
      <button class="category" type="button" data-category="खेल">खेल</button>
      <button class="category" type="button" data-category="बिजनेस">बिजनेस</button>
    </nav>

    <main>
      <section class="breaking-strip" aria-label="ब्रेकिंग न्यूज़">
        <span class="live-dot" aria-hidden="true"></span>
        <strong>ताज़ा खबर</strong>
        <span>आज की बड़ी खबरें और अपडेट पढ़ें</span>
      </section>

      <section class="lead-story" aria-labelledby="lead-title">
        <div class="lead-art" role="img" aria-label="शहर में सुबह का नज़ारा">
          <span class="art-sun"></span>
          <span class="art-building building-one"></span>
          <span class="art-building building-two"></span>
          <span class="art-building building-three"></span>
          <span class="art-road"></span>
          <span class="art-label">आज की बड़ी खबर</span>
        </div>
        <div class="lead-copy">
          <span class="story-kicker">मध्यप्रदेश <span>•</span> 10 मिनट पहले</span>
          <h1 id="lead-title">शहरों में बेहतर सुविधाओं के लिए नई योजनाओं पर काम शुरू</h1>
          <p>स्थानीय विकास और नागरिक सुविधाओं को लेकर प्रशासन ने साझा किया अपना रोडमैप।</p>
          <button class="save-button" type="button" aria-label="खबर सेव करें">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z" />
            </svg>
            <span>सेव करें</span>
          </button>
        </div>
      </section>

      <section class="feed-section" aria-labelledby="feed-title">
        <div class="section-heading">
          <h2 id="feed-title">आपके लिए</h2>
          <button class="refresh-button" type="button">अपडेट करें <span aria-hidden="true">↻</span></button>
        </div>
        <div class="story-list" id="story-list" aria-live="polite"></div>
        <p class="empty-state" hidden>इस श्रेणी में अभी कोई खबर नहीं है।</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="मुख्य नेविगेशन">
      <button class="bottom-item selected" type="button" data-section="होम">
        <span aria-hidden="true">⌂</span><span>होम</span>
      </button>
      <button class="bottom-item" type="button" data-section="वीडियो">
        <span aria-hidden="true">▷</span><span>वीडियो</span>
      </button>
      <button class="bottom-item" type="button" data-section="ई-पेपर">
        <span aria-hidden="true">▤</span><span>ई-पेपर</span>
      </button>
      <button class="bottom-item" type="button" data-section="मेरा भास्कर">
        <span aria-hidden="true">♡</span><span>मेरा भास्कर</span>
      </button>
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
